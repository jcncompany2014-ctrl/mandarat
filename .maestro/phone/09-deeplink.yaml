appId: com.jcncompany.mandarat
name: "09 딥링크"
tags:
  - phone
---
- launchApp:
    clearState: true
    arguments:
      "-AppleLanguages": "(ko)"
      "-AppleLocale": "ko_KR"
# mandarat://stats → 통계 화면, mandarat://today → 오늘
- runFlow: ../common/onboard.yaml
- openLink: "mandarat://stats"
# 시뮬레이터가 '열기'를 물으면 누른다
- tapOn:
    text: "열기|Open"
    optional: true
# 통계는 범위(이번 주 · 10주 · 올해)를 하나씩 보여 준다 — '한 해' 진입은 '올해' 범위 안에 있다
- tapOn:
    id: "stats-scope-year"
- scrollUntilVisible:
    element:
      id: "stats-year"
    direction: DOWN
    timeout: 15000
- openLink: "mandarat://today"
- tapOn:
    text: "열기|Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "tab-today"
      selected: true
    timeout: 10000
