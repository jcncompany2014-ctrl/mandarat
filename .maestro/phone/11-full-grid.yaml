appId: com.jcncompany.mandarat
name: "11 81칸 표"
tags:
  - phone
---
- launchApp:
    clearState: true
    arguments:
      "-AppleLanguages": "(ko)"
      "-AppleLocale": "ko_KR"
# 만다라트 탭 → 색 지도(블록 아홉) → 영역 하나를 크게(영역 화면) → 뒤로 지도
- runFlow: ../common/onboard.yaml
- runFlow: ../common/sample.yaml
- tapOn:
    id: "tab-grid"
- extendedWaitUntil:
    visible:
      id: "grid-table"
    timeout: 10000
# 지도는 블록 단추만 — 실천 칸(grid-cell-*)은 크게 본 블록에만 있다
- assertVisible:
    id: "grid-block-0"
- assertVisible:
    id: "grid-block-7"
- tapOn:
    id: "grid-block-3"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "grid-cell-3-3"
    timeout: 10000
- assertNotVisible:
    id: "grid-block-0"
# 머리의 ‹ 만다라트(영역 화면의 뒤로) → 지도
- tapOn:
    id: "detail-back"
- extendedWaitUntil:
    visible:
      id: "grid-block-0"
    timeout: 10000
- takeScreenshot: "phone-grid"
