    button { font-family: inherit; }
    textarea, input { font-family: inherit; }
    ::-webkit-scrollbar { width: 0; height: 0; }
    @keyframes mxScreenIn { from { transform: translateY(12px); } to { transform: none; } }
    .mx-screen { animation: mxScreenIn .3s cubic-bezier(.3,.85,.3,1); }
    @keyframes mxPop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
    @keyframes mxPulse { 0%,100% { transform: scale(1); opacity: .5; } 50% { transform: scale(1.08); opacity: .95; } }
    @keyframes mxFade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes mxSlideUp { from { transform: translateY(100%); } to { transform: none; } }
  </style>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<body>

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#221F2E" />
      <g fill="none" stroke="#C9A24B" stroke-width="1.4"><circle cx="50" cy="50" r="26"/><circle cx="50" cy="50" r="17"/><circle cx="50" cy="50" r="9"/></g>
      <g fill="#C9A24B"><circle cx="50" cy="24" r="3.4"/><circle cx="68" cy="32" r="3.4"/><circle cx="76" cy="50" r="3.4"/><circle cx="68" cy="68" r="3.4"/><circle cx="50" cy="76" r="3.4"/><circle cx="32" cy="68" r="3.4"/><circle cx="24" cy="50" r="3.4"/><circle cx="32" cy="32" r="3.4"/></g>
    </svg>
  </template>
  <script type="text/babel">

/* ====== ios-frame.jsx ====== */
// @ds-adherence-ignore -- omelette starter scaffold (raw elements/hex/px by design)

/* BEGIN USAGE */
// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports (to window): IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard
//
// Usage — wrap your screen content in <IOSDevice> to get the bezel, status bar
// and home indicator (props: title, dark, keyboard):
//
//   <IOSDevice title="Settings">
//     ...your screen content...
//   </IOSDevice>
//   <IOSDevice dark title="Search" keyboard>…</IOSDevice>
/* END USAGE */

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});


/* ====== tweaks-panel.jsx ====== */

/* BEGIN USAGE */

// don't hand-draw <input type="range">, segmented radios, steppers, etc.
//
// Usage (in an HTML file that loads React + Babel):
//
//   const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{

//                        options={[['#D97757', '#29261b', '#f6f4ef'],
//                                  ['#475569', '#0f172a', '#f1f5f9']]}

// ─────────────────────────────────────────────────────────────────────────────

const __TWEAKS_STYLE = `

    background:rgba(250,249,247,.78);color:#29261b;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

// Map semantic names → Lucide icon keys (rendered from lucide.icons data)
const ICON_LUCIDE = {
  heart: 'Heart', briefcase: 'Briefcase', book: 'BookOpen', people: 'Users',
  coin: 'PiggyBank', palette: 'Palette', lotus: 'Flower2', compass: 'Compass',
  grid: 'Grid3x3', home: 'House', check: 'Check', checkCircle: 'CircleCheck',
  chart: 'ChartColumnBig', plus: 'Plus', chevR: 'ChevronRight', chevL: 'ChevronLeft',
  flame: 'Flame', sparkle: 'Sparkles', target: 'Target', pencil: 'Pencil',
  dots: 'Ellipsis', calendar: 'Calendar', bell: 'Bell', settings: 'SlidersHorizontal',
};
const ICON_FILLED = new Set(['flame', 'sparkle']);

function Icon({ name, size = 22, color = 'currentColor', fill, sw = 1.9, weight, style }) {
  const L = window.lucide && window.lucide.icons;
  const node = L && (L[ICON_LUCIDE[name]] || L[name]);
  const kids = node ? node[2] : [];
  const filled = fill === undefined ? ICON_FILLED.has(name) : fill;
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={filled ? color : 'none'}
      stroke={color} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round"
      style={{ display: 'block', flexShrink: 0, ...style }}>
      {kids.map((ch, i) => React.createElement(ch[0], { key: i, ...ch[1] }))}
    </svg>
  );
}

// Circular progress ring
function Ring({ pct, size = 64, stroke = 6, color = '#2FA968', track = 'rgba(0,0,0,0.08)', children }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  return (
    <div style={{ position: 'relative', width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={track} strokeWidth={stroke} />
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={stroke}
          strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c * (1 - pct / 100)}
          style={{ transition: 'stroke-dashoffset .7s cubic-bezier(.4,1.2,.4,1)' }} />
      </svg>
      {children && (
        <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column',
          alignItems: 'center', justifyContent: 'center' }}>{children}</div>
      )}
    </div>
  );
}

// ── Mandala line-art motif: concentric rings + lotus petals ──
function MandalaArt({ size = 220, stroke = '#fff', opacity = 0.14, rings = 3, petals = 16, sw = 1, style }) {
  const c = size / 2;
  const els = [];
  for (let i = 1; i <= rings; i++) {
    els.push(<circle key={'c' + i} cx={c} cy={c} r={(c - sw) * (i / rings)} fill="none" stroke={stroke} strokeWidth={sw} />);
  }
  // ring of lotus petals (almond shapes via quadratic paths)
  const pr = c * 0.66, pw = c * 0.16, pl = c * 0.34;
  for (let i = 0; i < petals; i++) {
    const a = (i / petals) * Math.PI * 2;
    const cx = c + pr * Math.cos(a), cy = c + pr * Math.sin(a);
    const ux = Math.cos(a), uy = Math.sin(a);      // outward
    const vx = -uy, vy = ux;                        // tangent
    const tipX = cx + pl * ux, tipY = cy + pl * uy;
    const baseX = cx - pl * ux, baseY = cy - pl * uy;
    const lX = cx + pw * vx, lY = cy + pw * vy;
    const rX = cx - pw * vx, rY = cy - pw * vy;
    els.push(
      <path key={'p' + i}
        d={`M ${baseX} ${baseY} Q ${lX} ${lY} ${tipX} ${tipY} Q ${rX} ${rY} ${baseX} ${baseY} Z`}
        fill="none" stroke={stroke} strokeWidth={sw} />
    );
  }
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ opacity, ...style }}>{els}</svg>
  );
}

function ringPositions(c, R, count, startAngle) {
  return Array.from({ length: count }).map((_, i) => {
    const a = startAngle + i * (Math.PI * 2 / count);
    return { i, a, x: c + R * Math.cos(a), y: c + R * Math.sin(a) };
  });
}

// ── Focus timer: calm full-cover countdown ──
function FocusTimer({ M, item, done, toggle, onClose }) {
  const { ti, ai } = item;
  const th = THEMES[ti], a = th.actions[ai], key = `${ti}-${ai}`;
  const TOTAL = 25 * 60;
  const [left, setLeft] = useP(TOTAL);
  const [run, setRun] = useP(true);
  useEP(() => {
    if (!run || left <= 0) return;
    const id = setInterval(() => setLeft(l => (l <= 1 ? 0 : l - 1)), 1000);
    return () => clearInterval(id);
  }, [run, left]);
  const pct = (1 - left / TOTAL) * 100;
  const mm = String(Math.floor(left / 60)).padStart(2, '0');
  const ss = String(left % 60).padStart(2, '0');
  const finished = left <= 0;

  return (
    <div style={{ position: 'absolute', inset: 0, zIndex: 60, background: M.center, color: '#fff',
      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 28,
      animation: 'mxPop .3s ease' }}>
      <div style={{ position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%,-50%)', pointerEvents: 'none' }}>
        <MandalaArt size={360} stroke={th.color} opacity={0.18} rings={3} petals={24} sw={1} />
      </div>
      <button onClick={onClose} style={{ position: 'absolute', top: 56, right: 22, border: 'none', cursor: 'pointer',
        background: 'rgba(255,255,255,0.12)', width: 40, height: 40, borderRadius: 20, color: '#fff',
        display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <Icon name="plus" size={22} color="#fff" style={{ transform: 'rotate(45deg)' }} />
      </button>

      <Pill M={M} color={th.color}>{th.kr}</Pill>
      <div style={{ position: 'relative', margin: '22px 0 8px' }}>
        <Ring pct={pct} size={232} stroke={6} color={th.color} track="rgba(255,255,255,0.12)">
          <div style={{ fontSize: 56, fontWeight: 700, fontFamily: 'Space Grotesk', letterSpacing: 1, fontVariantNumeric: 'tabular-nums' }}>
            {finished ? '완료' : `${mm}:${ss}`}
          </div>
          <div style={{ fontSize: 13.5, color: 'rgba(255,255,255,0.6)', marginTop: 4, maxWidth: 170, textAlign: 'center', lineHeight: 1.3 }}>{a.kr}</div>
        </Ring>
      </div>

      <div style={{ display: 'flex', gap: 12, marginTop: 16 }}>
        {!finished && (
          <button onClick={() => setRun(r => !r)} style={{ padding: '13px 26px', borderRadius: 30, border: 'none', cursor: 'pointer', whiteSpace: 'nowrap',
            background: 'rgba(255,255,255,0.14)', color: '#fff', fontSize: 15, fontWeight: 700 }}>{run ? '일시정지' : '계속'}</button>
        )}
        <button onClick={() => { if (!done[key]) toggle(ti, ai); onClose(); }} style={{
          padding: '13px 26px', borderRadius: 30, border: 'none', cursor: 'pointer', whiteSpace: 'nowrap',
          background: th.color, color: '#fff', fontSize: 15, fontWeight: 800 }}>
          {finished ? '완료 처리' : '끝내고 완료'}
        </button>
      </div>
      <div style={{ marginTop: 14, fontSize: 12.5, color: 'rgba(255,255,255,0.45)', fontWeight: 500, whiteSpace: 'nowrap' }}>한 가지에만 머무르는 25분</div>
    </div>
  );
}

// ── Stats: contribution heatmap (70 days) ──
function Heatmap({ M }) {
  const weeks = 10, days = 7;
  // deterministic pseudo-intensity
  const cell = (w, d) => { const x = Math.sin((w * 7 + d) * 12.9898) * 43758.5453; const f = x - Math.floor(x); return Math.floor(f * 5); };
  const dayLabels = ['', '월', '', '수', '', '금', ''];
  return (
    <div style={{ display: 'flex', gap: 7 }}>
      <div style={{ display: 'grid', gridTemplateRows: `repeat(7, 1fr)`, gap: 4, paddingTop: 1 }}>
        {dayLabels.map((l, i) => <div key={i} style={{ fontSize: 9, color: M.faint, fontWeight: 600, height: 13, lineHeight: '13px' }}>{l}</div>)}
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: `repeat(${weeks}, 1fr)`, gap: 4, flex: 1 }}>
        {Array.from({ length: weeks }).map((_, w) => (
          <div key={w} style={{ display: 'grid', gridTemplateRows: `repeat(${days}, 1fr)`, gap: 4 }}>
            {Array.from({ length: days }).map((_, d) => {
              const v = (w === weeks - 1 && d > 5) ? 0 : cell(w, d);
              const op = [0.06, 0.28, 0.5, 0.72, 1][v];
              return <div key={d} style={{ aspectRatio: '1', borderRadius: 4,
                background: v === 0 ? (M.dark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.05)') : `color-mix(in srgb, ${M.accent} ${op * 100}%, transparent)` }} />;
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

function InsightCard({ M, done }) {
  const ranked = THEMES.map((th, ti) => ({ th, p: themeProgress(th, done).pct })).sort((a, b) => b.p - a.p);
  const top = ranked[0], low = ranked[ranked.length - 1];
  return (
    <div style={{ borderRadius: 22, padding: 18, background: M.hero, color: '#fff', position: 'relative', overflow: 'hidden',
      boxShadow: '0 12px 28px rgba(24,18,44,0.24)' }}>
      <div style={{ position: 'absolute', right: -30, top: -20 }}><MandalaArt size={150} stroke={M.gold} opacity={0.28} rings={2} petals={16} sw={1} /></div>
      <div style={{ position: 'relative', display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 11, fontWeight: 700,
        letterSpacing: 1.5, color: M.gold, fontFamily: 'Space Grotesk', textTransform: 'uppercase' }}>
        <Icon name="sparkle" size={14} color={M.gold} /> Insight
      </div>
      <div style={{ position: 'relative', fontSize: 16, fontWeight: 700, marginTop: 8, lineHeight: 1.45, letterSpacing: -0.2 }}>
        <b style={{ color: M.gold }}>{top.th.kr}</b> 영역이 가장 빛나고 있어요.<br />
        이번 주엔 <b style={{ color: '#fff' }}>{low.th.kr}</b>에 한 걸음 더 내딛어 볼까요?
      </div>

  );
}

// cell slots for a block: returns 9 entries (idx 4 is center)
function blockSlots(kind, ti, done) {
  // kind: 'center' | 'theme'
  const ring = [0, 1, 2, 3, null, 4, 5, 6, 7]; // map cellpos -> ring index (null=center)
  return ring.map((r, pos) => {
    if (pos === 4) {
      return kind === 'center'
        ? { type: 'main', label: CENTER.kr }
        : { type: 'name', label: THEMES[ti].kr, color: THEMES[ti].color };
    }
    if (kind === 'center') {
      const th = THEMES[r];
      return { type: 'theme', label: th.kr, color: th.color, ti: r };
    }
    return { type: 'action', label: THEMES[ti].actions[r].kr, color: THEMES[ti].color,
      done: !!done[`${ti}-${r}`] };
  });
}

function Block({ kind, ti, done, M, t, onTap }) {
  const cellR = t.cellShape === '각진' ? 2 : 6;
  const slots = blockSlots(kind, ti, done);
  return (
    <div onClick={() => onTap && onTap(kind, ti)} style={{
      display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 2.5,
      cursor: kind === 'theme' ? 'pointer' : 'default',
    }}>
      {slots.map((s, i) => {
        let bg, col, fw = 500, fs = 7.4;
        if (s.type === 'main') { bg = M.dark ? '#2A2731' : '#23211C'; col = '#fff'; fw = 800; fs = 8.2; }
        else if (s.type === 'name') { bg = s.color; col = '#fff'; fw = 800; fs = 8.6; }
        else if (s.type === 'theme') { bg = s.color; col = '#fff'; fw = 700; fs = 8.2; }
        else { // action
          bg = s.done ? s.color : tint(s.color, M.dark ? 24 : 16, M.dark);
          col = s.done ? '#fff' : (M.dark ? 'rgba(255,255,255,0.82)' : 'rgba(20,18,12,0.78)');
        }
        return (
          <div key={i} style={{
            aspectRatio: '1', borderRadius: cellR, background: bg, color: col,
            display: 'flex', alignItems: 'center', justifyContent: 'center', textAlign: 'center',
            fontSize: fs, fontWeight: fw, lineHeight: 1.04, padding: '1px 2px', overflow: 'hidden',
            letterSpacing: -0.2, position: 'relative', wordBreak: 'keep-all',
            boxShadow: s.type === 'action' && s.done ? `0 1px 4px ${s.color}55` : 'none',
          }}>
            {s.type === 'action' && s.done && (
              <span style={{ position: 'absolute', top: 2, right: 2, width: 6, height: 6,
                borderRadius: 4, background: 'rgba(255,255,255,0.9)' }} />
            )}
            {s.label}
          </div>
        );
      })}
    </div>
  );
}

                  {s.week.map((d, di) => (
                    <div key={di} style={{ width: 14, height: 14, borderRadius: 5,
                      background: d ? th.color : (M.dark ? 'rgba(255,255,255,0.09)' : 'rgba(0,0,0,0.07)') }} />
                  ))}
                </div>
              </div>
              <div style={{ textAlign: 'right', flexShrink: 0 }}>
                <div style={{ display: 'inline-flex', alignItems: 'center', gap: 3, fontSize: 17, fontWeight: 800, color: th.color, fontFamily: 'Space Grotesk' }}>
                  <Icon name="flame" size={15} color={th.color} />{s.cur}
                </div>
                <div style={{ fontSize: 10.5, color: M.faint, fontWeight: 600, whiteSpace: 'nowrap' }}>최고 {s.best}일</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function TodayKanban({ M, t, done, toggle }) {
  // derive 3 columns from today picks + a couple extra
  const items = [...TODAY_PICKS, [7, 0], [5, 0]];
  const [stage, setStage] = useStateB(() => {
    const init = {};
    items.forEach(([ti, ai], i) => { init[`${ti}-${ai}`] = done[`${ti}-${ai}`] ? 2 : (i % 3 === 0 ? 1 : 0); });
    return init;
  });
  const cols = [['할 일', 0], ['진행 중', 1], ['완료', 2]];
  const advance = (key) => setStage(s => ({ ...s, [key]: Math.min(2, (s[key] ?? 0) + 1) }));
  return (
    <div style={{ padding: '0 14px 16px', display: 'flex', flexDirection: 'column', gap: 14 }}>
      {cols.map(([label, ci]) => {
        const list = items.filter(([ti, ai]) => (stage[`${ti}-${ai}`] ?? 0) === ci);
        return (
          <div key={ci}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '0 8px 8px' }}>
              <span style={{ width: 9, height: 9, borderRadius: 5, flexShrink: 0, background: ci === 0 ? '#A39C8C' : ci === 1 ? '#F4793B' : '#2FA968' }} />
              <span style={{ fontSize: 14, fontWeight: 800, color: M.ink, whiteSpace: 'nowrap' }}>{label}</span>
              <span style={{ fontSize: 12, fontWeight: 700, color: M.faint, fontFamily: 'Space Grotesk', whiteSpace: 'nowrap' }}>{list.length}</span>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {list.map(([ti, ai], i) => {
                const th = THEMES[ti]; const a = th.actions[ai]; const key = `${ti}-${ai}`;
                return (
                  <div key={i} onClick={() => advance(key)} style={{ display: 'flex', alignItems: 'center', gap: 11,
                    padding: '12px 14px', borderRadius: 14, background: M.surface, border: `1px solid ${M.line}`, cursor: 'pointer',
                    borderLeft: `3px solid ${th.color}` }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 14.5, fontWeight: 700, color: M.ink,
                        textDecoration: ci === 2 ? 'line-through' : 'none', opacity: ci === 2 ? 0.6 : 1 }}>{a.kr}</div>
                      <div style={{ fontSize: 11, color: M.sub, fontWeight: 600, marginTop: 2, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{th.kr} · {a.en}</div>
                    </div>
                    {ci < 2 ? <Icon name="chevR" size={17} color={M.faint} />
                      : <Icon name="checkCircle" size={20} color="#2FA968" />}
                  </div>
                );
              })}
              {list.length === 0 && (
                <div style={{ fontSize: 12.5, color: M.faint, padding: '10px 14px', fontWeight: 500 }}>비어 있음</div>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function Stats({ M, t, done, go }) {
  const totalDone = Object.keys(done).filter(k => done[k]).length;
  const pct = Math.round((totalDone / 64) * 100);
  const week = [4, 6, 3, 7, 5, 8, 6];
  const days = ['월', '화', '수', '목', '금', '토', '일'];
  const maxW = Math.max(...week);
  const ranked = THEMES.map((th, ti) => ({ th, ti, p: themeProgress(th, done) })).sort((a, b) => b.p.pct - a.p.pct);

  return (
    <div>
      <Header M={M} en="Progress" kr="통계" right={<IconBtn M={M} name="sparkle" />} />

      {/* insight */}
      <div style={{ padding: '0 20px 16px' }}>
        <InsightCard M={M} done={done} />
      </div>

      {/* top stats */}
      <div style={{ padding: '0 20px 16px', display: 'grid', gridTemplateColumns: '1.3fr 1fr', gap: 12 }}>
        <div style={{ borderRadius: 22, padding: 18, background: M.surface, border: `1px solid ${M.line}`,
          display: 'flex', alignItems: 'center', gap: 14, boxShadow: M.dark ? 'none' : '0 4px 16px rgba(30,24,12,0.05)' }}>
          <Ring pct={pct} size={70} stroke={7} color={M.accent} track={M.dark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.07)'}>
            <div style={{ fontSize: 18, fontWeight: 800, color: M.ink, fontFamily: 'Space Grotesk' }}>{pct}%</div>
          </Ring>
          <div>
            <div style={{ fontSize: 26, fontWeight: 800, color: M.ink, fontFamily: 'Space Grotesk', letterSpacing: -0.5, whiteSpace: 'nowrap' }}>{totalDone}<span style={{ fontSize: 15, color: M.faint }}>/64</span></div>
            <div style={{ fontSize: 12.5, color: M.sub, fontWeight: 600, whiteSpace: 'nowrap' }}>전체 달성</div>
          </div>
        </div>
        <div style={{ borderRadius: 22, padding: 18, background: M.surface, border: `1px solid ${M.line}`,
          display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: 2, boxShadow: M.dark ? 'none' : '0 4px 16px rgba(30,24,12,0.05)' }}>
          <div style={{ display: 'inline-flex', alignItems: 'center', gap: 5 }}>
            <Icon name="flame" size={20} color="#F4793B" />
            <span style={{ fontSize: 26, fontWeight: 800, color: M.ink, fontFamily: 'Space Grotesk' }}>16</span>
          </div>
          <div style={{ fontSize: 12.5, color: M.sub, fontWeight: 600, whiteSpace: 'nowrap' }}>최장 연속일</div>
        </div>
      </div>

      {/* weekly activity */}
      <div style={{ padding: '0 20px 18px' }}>
        <div style={{ borderRadius: 22, padding: 20, background: M.surface, border: `1px solid ${M.line}`, boxShadow: M.dark ? 'none' : '0 4px 16px rgba(30,24,12,0.05)' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 16, gap: 8 }}>
            <span style={{ fontSize: 15, fontWeight: 800, color: M.ink, whiteSpace: 'nowrap' }}>이번 주 실천</span>
            <span style={{ fontSize: 12.5, color: M.sub, fontWeight: 600, whiteSpace: 'nowrap' }}>총 {week.reduce((a, b) => a + b, 0)}회</span>
          </div>
          <div style={{ display: 'flex', alignItems: 'flex-end', gap: 9, height: 96 }}>
            {week.map((v, i) => (
              <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 7, height: '100%', justifyContent: 'flex-end' }}>
                <div style={{ width: '100%', height: `${(v / maxW) * 78}px`, borderRadius: 7,
                  background: i === 5 ? 'linear-gradient(#F4793B,#E5547F)' : (M.dark ? 'rgba(255,255,255,0.13)' : 'rgba(35,33,28,0.13)') }} />
                <span style={{ fontSize: 11, fontWeight: 700, color: i === 5 ? '#F4793B' : M.faint }}>{days[i]}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* contribution heatmap */}
      <div style={{ padding: '0 20px 18px' }}>
        <div style={{ borderRadius: 22, padding: 20, background: M.surface, border: `1px solid ${M.line}`, boxShadow: M.dark ? 'none' : '0 4px 16px rgba(30,24,12,0.05)' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 16, gap: 8 }}>
            <span style={{ fontSize: 15, fontWeight: 800, color: M.ink, whiteSpace: 'nowrap' }}>최근 70일 실천</span>
            <span style={{ fontSize: 12.5, color: M.sub, fontWeight: 600, whiteSpace: 'nowrap' }}>꾸준함의 무늬</span>
          </div>
          <Heatmap M={M} />
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'flex-end', gap: 6, marginTop: 12 }}>
            <span style={{ fontSize: 10.5, color: M.faint, fontWeight: 600 }}>적음</span>
            {[0.06, 0.28, 0.5, 0.72, 1].map((o, i) => (
              <span key={i} style={{ width: 11, height: 11, borderRadius: 3,
                background: o === 0.06 ? (M.dark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.05)') : `color-mix(in srgb, ${M.accent} ${o * 100}%, transparent)` }} />

            <span style={{ fontSize: 10.5, color: M.faint, fontWeight: 600 }}>많음</span>
          </div>
        </div>
      </div>

      {/* ranked theme bars */}
      <div style={{ padding: '0 20px 6px', fontSize: 16, fontWeight: 800, color: M.ink }}>영역별 달성률</div>
      <div style={{ padding: '12px 20px 16px', display: 'flex', flexDirection: 'column', gap: 13 }}>
        {ranked.map(({ th, ti, p }) => (
          <div key={ti} onClick={() => go('detail', ti)} style={{ cursor: 'pointer' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
              <span style={{ width: 8, height: 8, borderRadius: 4, background: th.color }} />
              <span style={{ fontSize: 13.5, fontWeight: 700, color: M.ink, flex: 1 }}>{th.kr}</span>
              <span style={{ fontSize: 12.5, fontWeight: 800, color: th.color, fontFamily: 'Space Grotesk' }}>{p.pct}%</span>
            </div>
            <div style={{ height: 9, borderRadius: 5, background: M.dark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.055)', overflow: 'hidden' }}>
              <div style={{ height: '100%', width: `${p.pct}%`, background: th.color, borderRadius: 5, transition: 'width .6s ease' }} />
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// mandarat-app.jsx — shell, tab bar, tweaks, routing
const { useState: useApp, useRef: useRefApp, useEffect: useEffectApp } = React;

const TABS = [
  { id: 'dashboard', icon: 'home', label: '홈' },
  { id: 'grid', icon: 'grid', label: '만다라트' },
  { id: 'today', icon: 'checkCircle', label: '오늘' },
  { id: 'stats', icon: 'chart', label: '통계' },
];

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "mood": "크림",
  "mgmt": "일일 체크",
  "cellShape": "둥근",
  "accent": "#F4793B"
}/*EDITMODE-END*/;

function TabBar({ M, active, onTab }) {
  return (
    <div style={{
      position: 'relative', zIndex: 30, paddingBottom: 26, paddingTop: 9,
      background: M.tabBg, backdropFilter: 'blur(18px) saturate(180%)', WebkitBackdropFilter: 'blur(18px) saturate(180%)',
      borderTop: `1px solid ${M.line}`, display: 'flex', justifyContent: 'space-around', alignItems: 'center',
    }}>
      {TABS.map(tab => {
        const on = active === tab.id;
        return (
          <button key={tab.id} onClick={() => onTab(tab.id)} style={{
            border: 'none', background: 'transparent', cursor: 'pointer',
            display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, padding: '4px 14px', flex: 1,
          }}>
            <Icon name={tab.icon} size={24} color={on ? M.accent : M.faint} sw={on ? 2.1 : 1.8} />
            <span style={{ fontSize: 10.5, fontWeight: on ? 800 : 600, color: on ? M.accent : M.faint, letterSpacing: -0.2 }}>{tab.label}</span>
          </button>
        );
      })}
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [route, setRoute] = useApp({ screen: 'dashboard', ti: 0 });
  const [done, setDone] = useApp(() => initialDone());
  // power state
  const [sheet, setSheet] = useApp(null);     // { ti, ai }
  const [focus, setFocus] = useApp(null);     // { ti, ai }
  const [quick, setQuick] = useApp(false);
  const [notes, setNotes] = useApp({});
  const [todayExtra, setTodayExtra] = useApp([]); // { id, ti, text, done }
  const [todayKeys, setTodayKeys] = useApp(() => new Set(TODAY_PICKS.map(p => p.join('-'))));
  const [mood, setMood] = useApp(null);
  const [reflection, setReflection] = useApp('');
  const [celebrate, setCelebrate] = useApp(false);
  const scrollRef = useRefApp(null);
  const prevComplete = useRefApp(true);

  const M = { ...MOODS[t.mood], accent: t.accent };
  const go = (screen, ti = 0) => setRoute({ screen, ti });
  const toggle = (ti, ai) => setDone(d => { const k = `${ti}-${ai}`; return { ...d, [k]: !d[k] }; });

  // power handlers
  const openAction = (ti, ai) => setSheet({ ti, ai });
  const startFocus = (ti, ai) => { setSheet(null); setFocus({ ti, ai }); };
  const setNote = (key, v) => setNotes(o => ({ ...o, [key]: v }));
  const getNote = (key) => notes[key];
  const inToday = (key) => todayKeys.has(key);
  const toggleToday = (key) => setTodayKeys(s => { const n = new Set(s); n.has(key) ? n.delete(key) : n.add(key); return n; });
  const addCustom = (ti, text) => setTodayExtra(a => [...a, { id: Date.now(), ti, text: text.trim(), done: false }]);
  const toggleExtra = (id) => setTodayExtra(a => a.map(x => x.id === id ? { ...x, done: !x.done } : x));
  window.MX = { openAction, startFocus, getNote, inToday };

  // today aggregation + celebration
  const todayList = [...todayKeys].map(k => k.split('-').map(Number));
  const tDone = todayList.filter(([ti, ai]) => done[`${ti}-${ai}`]).length + todayExtra.filter(x => x.done).length;
  const tTotal = todayList.length + todayExtra.length;
  useEffectApp(() => {
    const complete = tTotal > 0 && tDone === tTotal;
    if (complete && !prevComplete.current) setCelebrate(true);
    prevComplete.current = complete;
  }, [tDone, tTotal]);

  useEffectApp(() => { if (scrollRef.current) scrollRef.current.scrollTop = 0; }, [route.screen, route.ti]);

  const activeTab = route.screen === 'detail' ? 'grid' : route.screen;
  const tx = { list: todayList, extra: todayExtra, toggleExtra, mood, setMood, reflection, setReflection,
    openAction, done, toggle, tDone, tTotal };

  let screen;
  if (route.screen === 'dashboard') screen = <Dashboard M={M} t={t} done={done} go={go} tx={tx} />;
  else if (route.screen === 'grid') screen = <GridScreen M={M} t={t} done={done} go={go} />;
  else if (route.screen === 'detail') screen = <Detail M={M} t={t} done={done} toggle={toggle} go={go} ti={route.ti} />;
  else if (route.screen === 'today') screen = <Today M={M} t={t} done={done} toggle={toggle} go={go} tx={tx} />;
  else if (route.screen === 'stats') screen = <Stats M={M} t={t} done={done} go={go} />;

  return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: 'radial-gradient(circle at 30% 20%, #eceae4, #d9d6cf)', padding: 24 }}>
      <IOSDevice>
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: M.bg, color: M.ink,
          position: 'relative', fontFamily: 'Pretendard, -apple-system, system-ui, sans-serif' }}>
          <div ref={scrollRef} style={{ flex: 1, overflowY: 'auto', overflowX: 'hidden' }}>
            <div key={route.screen + route.ti} className="mx-screen">{screen}</div>
            <div style={{ height: 12 }} />
          </div>
          <TabBar M={M} active={activeTab} onTab={(id) => go(id)} />

          <FAB M={M} onClick={() => setQuick(true)} />
          {sheet && <ActionSheet M={M} item={sheet} done={done} toggle={toggle} getNote={getNote} setNote={setNote}
            inToday={inToday} toggleToday={toggleToday} onFocus={startFocus} onClose={() => setSheet(null)} />}
          {focus && <FocusTimer M={M} item={focus} done={done} toggle={toggle} onClose={() => setFocus(null)} />}
          {quick && <QuickAdd M={M} onAdd={addCustom} onClose={() => setQuick(false)} />}
          {celebrate && <Celebration M={M} count={tTotal} onClose={() => setCelebrate(false)} />}
        </div>
      </IOSDevice>

      <TweaksPanel>
        <TweakSection label="무드 / Mood" />
        <TweakRadio label="배경 무드" value={t.mood} options={['크림', '화이트', '파스텔', '다크']}
          onChange={v => setTweak('mood', v)} />
        <TweakColor label="포인트 컬러" value={t.accent}
          options={['#F4793B', '#4F6BED', '#2FA968', '#8B5CF6']}
          onChange={v => setTweak('accent', v)} />
        <TweakSection label="관리 방식 / Manage" />
        <TweakRadio label="오늘 화면" value={t.mgmt} options={['일일 체크', '습관 스트릭', '칸반']}
          onChange={v => setTweak('mgmt', v)} />
        <TweakSection label="그리드 / Grid" />
        <TweakRadio label="셀 모양" value={t.cellShape} options={['둥근', '각진']}
          onChange={v => setTweak('cellShape', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);


  </script>
