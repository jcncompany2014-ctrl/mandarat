<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- 홈 화면에 추가 — iOS는 apple-touch-icon(180), 안드로이드·PWA는 manifest의 192·512 아이콘을 쓴다 -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="만다라트" />
    <meta name="application-name" content="만다라트" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- 앱이 뜨기 전에 <html lang>을 정한다 — ?lang= → 저장된 고르기 → 브라우저 언어에서 처음 나오는 ko·ja·en → ko (src/i18n resolveLang과 같은 순서).
         서체와 줄바꿈이 첫 그림부터 그 언어를 따른다. 앱이 뜨면 LangBoot가 같은 값을 다시 적는다. -->
    <script>
      (function () {
        var ok = { ko: 1, ja: 1, en: 1 };
        var l = null;
        try {
          var q = /[?&]lang=([^&#]*)/.exec(location.search);
          if (q) l = decodeURIComponent(q[1]).toLowerCase();
          if (!ok[l]) {
            var p = localStorage.getItem('mandarat:lang:v1');
            l = ok[p] ? p : null;
          }
          if (!l) {
            var list = navigator.languages || [navigator.language];
            for (var i = 0; i < list.length && !l; i++) {
              var c = String(list[i] || '').slice(0, 2).toLowerCase();
              if (ok[c]) l = c;
            }
          }
        } catch (e) {}
        if (ok[l]) document.documentElement.lang = l;
      })();
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #fbf9f4;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>만다라트를 쓰려면 자바스크립트를 켜 주세요. · JavaScriptをオンにしてください。 · Turn on JavaScript to use this app.</noscript>
    <div id="root"></div>
  </body>
</html>
