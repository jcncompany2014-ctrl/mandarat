<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="mock:size" content="540x675">
<title>A · 공유 이미지 4:5</title>
<link rel="stylesheet" href="/tools/design-mockups/kit.css">
<link rel="stylesheet" href="/tools/design-mockups/fonts.css">
<link rel="stylesheet" href="/docs/design/mockups/a/tokens.css">
<style>
  /* The share image, 4:5 (540 × 675 pt = 1080 × 1350 px). Not a capture of the screen: the sheet
     itself, printed at near full width, under the owner's goal; the folio on top, the mark and
     the wordmark at the foot (CH-12, FI-09). Today's corners are left out: "today" means nothing
     to the person who sees the post. */
  body { width: 540px; height: 675px; background: var(--paper); }
  .poster { position: absolute; inset: 0; padding: 0 23px; }
  .top { padding-top: 26px; }
  .folio { display: flex; justify-content: space-between; height: 18px; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
  .goal { font: 600 40px/52px var(--serif); letter-spacing: -0.02em; color: var(--ink); white-space: nowrap; }
  .fig { font: 400 30px/40px var(--serif); color: var(--ink); white-space: nowrap; padding-bottom: 3px; }
  .fig small { font: 500 15px/18px var(--sans); color: var(--ink-2); margin-left: 3px; }
  #sheet { margin-top: 16px; }
  /* the sheet is measured at the kit's 10pt and then set at 13pt: cell and type grow by the same
     1.3, so every label breaks exactly as on the phone (kit request: opts.scale in A.chart). */
  #sheet.is-poster .a-cell { font-size: 13px; line-height: 15.6px; }
  #sheet.is-poster .a-cell.is-core { font-size: 14.5px; line-height: 17px; }
  .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; height: 28px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .word { font: 700 15px/18px var(--sans); letter-spacing: -0.01em; color: var(--print-strong); }
</style>
</head>
<body>
<div class="poster">
  <div class="top">
    <div class="folio"><span class="t-folio">핵심 목표</span><span class="t-folio" id="folio"></span></div>
    <div class="head"><div class="goal" id="goal"></div><div class="fig" id="fig"></div></div>
  </div>
  <div id="sheet"></div>
  <div class="foot">
    <div class="brand"><span id="mark"></span><span class="word">만다라트</span></div>
    <span class="t-folio" id="date"></span>
  </div>
</div>
<script src="/docs/design/mockups/a/shared.js"></script>
<script>
A.ready().then((doc) => {
  const v = doc.view, d = v.date;
  document.querySelector('#folio').textContent = `${d.year}. ${parseInt(d.month, 10)}. ${d.day}. 기준`;
  document.querySelector('#goal').textContent = doc.coreGoal;
  document.querySelector('#fig').innerHTML = `${v.progress.done}/${v.progress.of}<small>칸</small>`;
  A.chart('#sheet', doc, { level: 'L2', cell: 54, today: false });
  document.querySelector('#sheet').classList.add('is-poster');
  A.mark('#mark', { size: 24, variant: 'heart' });
  document.querySelector('#date').textContent = `${d.year} · ${d.left}`;
});
</script>
</body>
</html>
