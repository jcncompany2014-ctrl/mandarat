<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="mock:size" content="390x844">
<title>A · 한 해 돌아보기 2025</title>
<link rel="stylesheet" href="/tools/design-mockups/kit.css">
<link rel="stylesheet" href="/tools/design-mockups/fonts.css">
<link rel="stylesheet" href="/docs/design/mockups/a/tokens.css">
<style>
  /* An archived year is the sheet itself, laid on the page exactly as on the 만다라트 tab
     (CH-17: no box round it, no second header, its dates printed once as the folio line).
     Under it, how it filled: four thumbnails at the L1 level, then four figures at one size. */
  .sheet { display: flex; flex-direction: column; align-items: center; margin-top: 12px; }
  .sheet-line { align-self: stretch; height: 18px; margin: 0 var(--gutter); display: flex; justify-content: space-between; align-items: baseline; }
  #chart { margin: 6px 0; }

  .sec { margin-top: 24px; }
  .sec + .sec { margin-top: 30px; }

  /* 표가 채워진 모습: four frames of the same sheet, L1 (solid structure, wash for done, paper),
     on one baseline, the date under each in print ink. The last one is the year as it closed. */
  .frames { display: flex; justify-content: space-between; }
  .frame { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .frame.is-last .t-label { color: var(--ink); }

  /* four figures, one size (TY-10): four filled-in fields in a row, no rules and no boxes; the space
     above groups them. Label printed, figure written: MaruBuri 22 with the unit in Pretendard. */
  .figs { display: grid; grid-template-columns: repeat(4, 1fr); column-gap: 12px; }
  .fig { display: flex; flex-direction: column; gap: 2px; }
  .fig .t-figure { font-size: 22px; line-height: 30px; white-space: nowrap; }
  .fig .t-figure small { font-size: 11px; margin-left: 1px; margin-right: 2px; }
</style>
</head>
<body>
<div class="a-page">
  <div id="header"></div>
  <div class="sheet">
    <div class="sheet-line"><span class="t-label" id="form-name"></span><span class="t-label" id="dates"></span></div>
    <div id="chart"></div>
  </div>
  <div class="a-body">
    <section class="sec">
      <div class="a-section"><span class="t-label is-section">표가 채워진 모습</span></div>
      <div class="frames" id="frames"></div>
    </section>
    <section class="sec">
      <div class="figs" id="figs"></div>
    </section>
  </div>
  <div id="bar"></div>
</div>
<script src="/docs/design/mockups/a/shared.js"></script>
<script>
A.ready().then((doc) => {
  // The archived 2025 sheet. The demo record has one sheet; the current app's archive screens draw
  // that same sheet as 2025 (ko-year-sheet.png), so this does too: 24 of 64, 1월 6일 – 12월 31일, 120일 기록.
  A.header('#header', { back: '통계', title: doc.coreGoal, written: true, figure: '2025', action: 'share' });
  document.querySelector('#form-name').textContent = '한 해 돌아보기 · 지난 표';
  document.querySelector('#dates').textContent = '1월 6일 – 12월 31일';
  // read-only: no today corners on a closed year
  A.chart('#chart', doc, { level: 'L2', cell: 41, today: false });

  // ── how it filled ──────────────────────────────────────────────────────────
  // The record has no completion dates, so the order is invented (listed in the report):
  // the daily habits first, then the one-off cells through the year. Each frame is cumulative.
  const by = [
    ['하루 물 2L', '가계부 쓰기', '명상 10분', '구독 정리', '다큐 시청'],
    ['1만보 걷기', '정기 건강검진', '온라인 강의', '감사일기', '사진 찍기', '식물 키우기', '부모님 주 1통화'],
    ['사이드 프로젝트', '새 기술 1개', '요리 10가지', '호흡 연습', '산책하기', '아침 글쓰기'],
  ];
  const dates = ['3월 31일', '6월 30일', '9월 30일', '12월 31일'];
  const upTo = (k) => {
    if (k === 3) return null; // the year as it closed: the record itself
    const set = new Set(by.slice(0, k + 1).flat());
    const d = JSON.parse(JSON.stringify(doc));
    d.areas.forEach((a) => a.actions.forEach((x) => { x.done = x.done && set.has(x.text); }));
    return d;
  };
  const host = document.querySelector('#frames');
  dates.forEach((date, k) => {
    const d = upTo(k) || doc;
    const f = document.createElement('div');
    f.className = 'frame' + (k === 3 ? ' is-last' : '');
    f.innerHTML = `<div class="th"></div><span class="t-label">${date}</span>`;
    host.appendChild(f);
    A.chart(f.querySelector('.th'), d, { level: 'L1', cell: 8, today: false });
  });

  // ── four figures at one size ───────────────────────────────────────────────
  // 기록한 날 and 달성 are the archive's own (ko-year-sheet.png); 집중 is the record's;
  // 가장 긴 연속 is invented for a closed year (the live record only knows this week's 3일).
  const u = (t) => t.replace(/(\d+)([^\d/\s]+)/g, '$1<small>$2</small>');
  const figs = [['기록한 날', '120일'], ['가장 긴 연속', '12일'], ['달성', '24/64칸'], ['집중', '2시간 5분']];
  document.querySelector('#figs').innerHTML = figs.map(([l, f]) => `<div class="fig"><span class="t-label">${l}</span><span class="t-figure">${u(f)}</span></div>`).join('');

  A.tabBar('#bar', { active: 'stats' });
});
</script>
</body>
</html>
