<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="mock:size" content="390x844">
<title>A · 오늘 · 하루 마감</title>
<link rel="stylesheet" href="/tools/design-mockups/kit.css">
<link rel="stylesheet" href="/tools/design-mockups/fonts.css">
<link rel="stylesheet" href="/docs/design/mockups/a/tokens.css">
<style>
  /* 오늘, all ten done, the day closed. Read as the foot of a ledger page:
     the entries (folded to one line) → the double rule → what the day came to, written under it.
     Then one small module for the evening (mood + one line). Nothing asks for more. */
  .sec { margin-top: 30px; }

  /* the folded list: one row, the same anatomy as a task row */
  .fold .a-row-title { white-space: normal; }
  .fold .a-row-meta { display: flex; gap: 0; }
  .fold .a-row-meta span + span { margin-left: 7px; }
  .fold .a-row-meta .a-dye { margin-right: 3px; }
  .fold .a-row-meta b { font-weight: 400; margin-left: 3px; }
  .fold-open { display: flex; align-items: center; gap: 2px; font: 700 13px/18px var(--sans); color: var(--ink); }
  .fold-open svg { margin-right: -4px; }

  /* KIT REQUEST: the ledger double rule (close of a page). Softened: two 1pt rules in the pale
     closing grey (--print-mid), 2pt of paper between, starting at the text like a row hairline. */
  .a-double { height: 4px; margin-left: 38px; border-top: var(--rule) solid var(--print-mid); border-bottom: var(--rule) solid var(--print-mid); }

  /* the day's total under the rule: the 正 of the day, written large, with the closing sentence */
  .close { display: flex; align-items: center; gap: 20px; padding: 32px 0 36px; }
  .close-mark { flex: none; }
  .close-text { display: flex; flex-direction: column; gap: 2px; }

  /* KIT REQUEST: mood choices as soft tiles (the chart's empty tint, 10pt corners, 6pt gaps), no
     rules. The chosen one is filled with ink, its word in paper, as the chosen cell of a segment (S.segment). */
  .a-seg { display: flex; gap: 6px; }
  .a-seg-cell { flex: 1; height: 44px; display: flex; align-items: center; justify-content: center;
                border-radius: 10px; background: var(--tile); font: 500 14px/18px var(--sans); color: var(--ink); }
  .a-seg-cell.is-on { font-weight: 600; background: var(--ink); color: var(--paper); }

  /* KIT REQUEST: one input line, softened: a tile with 10pt corners instead of a ruled line to write on.
     Placeholder = printed, so print ink. */
  .a-line { display: flex; align-items: center; height: 48px; padding: 0 16px; border-radius: 10px; background: var(--tile); }
  .a-line .ph { font: 400 16px/24px var(--sans); color: var(--print); }

  .module .t-label + .a-seg, .module .t-label + .a-line { margin-top: 8px; }
  .module .gap { height: 24px; }
  .week { margin-top: 36px; }
</style>
</head>
<body>
<div class="a-page">
  <div id="header"></div>
  <div class="a-body">
    <section class="sec">
      <div class="a-section"><span class="t-label is-section">오늘 할 일</span><span class="fold-open" id="open"></span></div>
      <div class="a-list fold" id="fold"></div>
      <div class="a-double"></div>
      <div class="close">
        <div class="close-mark" id="mark"></div>
        <div class="close-text">
          <div class="t-prompt">오늘은 여기까지예요.</div>
          <div class="t-note" id="closed"></div>
        </div>
      </div>
    </section>

    <section class="module">
      <div class="t-label">오늘 기분</div>
      <div class="a-seg" id="mood"></div>
      <div class="gap"></div>
      <div class="t-label">한 줄</div>
      <div class="a-line"><span class="ph">오늘 한 줄</span></div>
    </section>

    <section class="sec week">
      <div class="a-section"><span class="t-label is-section">이번 주</span><span class="t-meta" id="week-total" style="color:var(--ink)"></span></div>
      <div id="week"></div>
    </section>
  </div>
  <div id="bar"></div>
</div>
<script src="/docs/design/mockups/a/shared.js"></script>
<script src="/docs/design/mockups/a/parts-focus-dayclose.js"></script>
<script>
A.ready().then((doc) => {
  const v = doc.view, d = v.date;
  const n = v.today.rows.length; // all ten done today
  A.header('#header', { eyebrow: `${d.month} ${d.day}일 ${d.weekday}`, title: '오늘', figure: `${n}/${n}`, action: 'more' });

  // the folded list: one row. Leading box ticked (no single area, so it takes ink), the count as the title,
  // the areas as the one meta line (from the record's filter counts), one control on the right.
  const areas = v.today.filters.slice(1).map(([name, k]) => `<span><i class="a-dye" style="--d:var(--dye-${A.areaIndex(doc, name) + 1})"></i>${name}<b>${k}</b></span>`).join('');
  document.querySelector('#fold').innerHTML =
    `<div class="a-row">${A.check({ done: true })}<div class="a-row-main"><div class="a-row-title">${v.today.rows[0].text}, ${v.today.rows[1].text} 외 ${n - 2}개</div><div class="a-row-meta">${areas}</div></div></div>`;
  document.querySelector('#open').innerHTML = `펼치기${A.glyph('down', 16)}`;

  document.querySelector('#mark').innerHTML = A.tally(n, { size: 64 });
  document.querySelector('#closed').textContent = `${d.month} ${d.day}일 마감 · 오후 9:40`;

  const moods = ['힘듦', '별로', '보통', '좋음', '최고'];
  document.querySelector('#mood').innerHTML = moods.map((m, i) => `<div class="a-seg-cell${i === 3 ? ' is-on' : ''}">${m}</div>`).join('');

  // the week with today closed: 수 now carries the day's ten strokes (two 正), the total moves 7 → 16
  const week = Object.assign({}, v.week, { days: v.week.days.map((x) => (x[2] === 'today' ? [x[0], n, 'today'] : x)) });
  A.weekStrip('#week', week);
  const total = week.days.reduce((t, x) => t + (x[1] || 0), 0);
  document.querySelector('#week-total').textContent = `${total}번`;

  A.tabBar('#bar', { active: 'today' });
});
</script>
</body>
</html>
