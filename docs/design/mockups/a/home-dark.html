<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="mock:size" content="390x844">
<meta name="mock:dark" content="1">
<title>A · 홈 (다크)</title>
<link rel="stylesheet" href="/tools/design-mockups/kit.css">
<link rel="stylesheet" href="/tools/design-mockups/fonts.css">
<link rel="stylesheet" href="/docs/design/mockups/a/tokens.css">
<style>
  /* The goal is the title (34pt, written ink); the date is only the folio line above it.
     Hero: three filled-in fields on the gutter and the sheet in miniature on the right. The fields'
     top rule and last hairline register with the thumbnail's frame. */
  .hero-row { display: flex; gap: 24px; margin-top: 12px; }
  .hero-fields { flex: 1; display: flex; flex-direction: column; border-top: var(--rule) solid var(--print-mid); }
  .hero-field { flex: 1; display: flex; flex-direction: column; justify-content: center; border-bottom: var(--hair) solid var(--print-rule); }
  .sec { margin-top: 18px; }
  .hero-row + .sec { margin-top: 24px; }
</style>
</head>
<body>
<div class="a-page">
  <div id="header"></div>
  <div class="a-body">
    <div class="hero-row">
      <div class="hero-fields">
        <div class="hero-field"><div class="t-label">오늘</div><div class="t-figure is-field" id="fig-today"></div></div>
        <div class="hero-field"><div class="t-label">달성</div><div class="t-figure is-field" id="fig-cells"></div></div>
        <div class="hero-field"><div class="t-label">남은 날</div><div class="t-figure is-field" id="fig-left"></div></div>
      </div>
      <div id="chart"></div>
    </div>

    <section class="sec">
      <div class="a-section"><span class="t-label">오늘 할 일</span><span class="a-link" id="all"></span></div>
      <div class="a-list" id="rows"></div>
    </section>

    <section class="sec">
      <div class="a-section"><span class="t-label" id="week-label"></span><span class="t-meta" id="week-total" style="color:var(--ink)"></span></div>
      <div id="week"></div>
    </section>

    <section class="sec">
      <div class="a-section"><span class="t-label">8개 영역</span></div>
      <div id="ledger"></div>
    </section>
  </div>
  <div id="bar"></div>
</div>
<script src="/docs/design/mockups/a/shared.js"></script>
<script>
A.ready().then((doc) => {
  const v = doc.view, d = v.date;
  // the date is furniture: the folio line. The title is the owner's goal.
  A.header('#header', { eyebrow: `${d.month} ${d.day}일 ${d.weekday} · ${d.week}`, title: doc.coreGoal, headline: true, action: 'settings' });
  A.chart('#chart', doc, { level: 'L1', cell: 20 });
  document.querySelector('#fig-today').textContent = `${v.today.done}/${v.today.of}`;
  document.querySelector('#fig-cells').innerHTML = `${v.progress.done}/${v.progress.of}<small>칸</small>`;
  document.querySelector('#fig-left').innerHTML = `${d.left.replace(/\D/g, '')}<small>일</small>`;

  // today's list: this week's two focus items pinned first (the same two on 오늘), then what is next,
  // then the one done today. 친구 모임 is a focus item but not one of today's ten, so it has no box.
  const rows = v.today.rows;
  const find = (t) => rows.find((r) => r.text === t);
  const pinned = v.weekFocus.map((f) => {
    const r = find(f.text);
    return r ? A.todayRow(doc, r, { rightPrint: '중점' }) : A.row(doc, { text: f.text, area: f.area, meta: '이번 주', check: false, rightPrint: '중점' });
  });
  document.querySelector('#rows').innerHTML = pinned.concat([
    A.todayRow(doc, rows[0]),
    A.todayRow(doc, rows[1]),
    A.todayRow(doc, rows.find((r) => r.doneToday)),
  ]).join('');
  document.querySelector('#all').innerHTML = `전체 보기${A.icon('chevron', { size: 16 })}`;

  document.querySelector('#week-label').textContent = v.week.label;
  document.querySelector('#week-total').textContent = v.week.total;
  A.weekStrip('#week', v.week);
  A.ledger('#ledger', doc);
  A.tabBar('#bar', { active: 'home' });
});
</script>
</body>
</html>
