<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="mock:size" content="390x844">
<title>A · 25분 집중</title>
<link rel="stylesheet" href="/tools/design-mockups/kit.css">
<link rel="stylesheet" href="/tools/design-mockups/fonts.css">
<link rel="stylesheet" href="/docs/design/mockups/a/tokens.css">
<style>
  /* 25분 집중: a full-screen page of the same notebook (no tab bar; it covers the app).
     Header anatomy as on every tab: eyebrow = the area and "25분 집중", title = the action in
     writing ink, one action = minimise (the session keeps running in a bar and the Live Activity).
     Hero: the 25-minute form, one box per minute, 315pt on the left gutter with a printed minute ruler to its right.
     Under it one filled-in field: the time left in MaruBuri. Controls sit in the thumb zone. */
  #minutes { margin: 36px 0 0; }  /* 315pt on the gutter; the minute ruler takes the 27pt to its right */

  .field { margin-top: 36px; border-top: var(--rule) solid var(--print-mid); border-bottom: var(--hair) solid var(--print-rule);
           display: flex; align-items: flex-end; justify-content: space-between; padding: 7px 0 10px; }
  .field-main { display: flex; flex-direction: column; gap: 4px; }
  .clock { font: 400 48px/54px var(--serif); letter-spacing: -0.01em; color: var(--ink); font-variant-numeric: tabular-nums; }
  .field-side { text-align: right; padding-bottom: 6px; }
  .field-side .t-figure { font-size: 22px; line-height: 30px; }

  .note { margin: 12px 0 0; }
  .controls { position: absolute; left: var(--gutter); right: var(--gutter); bottom: 40px; }
  .btns { display: flex; gap: 12px; }
  .btns .a-btn { flex: 1; padding: 0; gap: 8px; }
  .end { display: flex; justify-content: center; margin-top: 8px; }
  .end span { display: inline-flex; align-items: center; height: 44px; font: 600 13px/18px var(--sans); color: var(--ink);
              text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; text-decoration-color: var(--print-edge); }
</style>
</head>
<body>
<div class="a-page">
  <div id="header"></div>
  <div class="a-body">
    <div id="minutes"></div>

    <div class="field">
      <div class="field-main">
        <span class="t-label"><i class="a-today"></i>남은 시간</span>
        <span class="clock" id="clock"></span>
      </div>
      <div class="field-side">
        <div class="t-label">끝나는 시각</div>
        <div class="t-figure" id="ends"></div>
      </div>
    </div>
    <p class="t-note note">25분 동안 한 가지에만. 화면을 접어 두어도 시간은 흘러가요.</p>
  </div>

  <div class="controls">
    <div class="btns">
      <div class="a-btn is-secondary" id="pause"></div>
      <div class="a-btn" id="finish">끝내고 했어요</div>
    </div>
    <div class="end"><span>그만하기</span></div>
  </div>
</div>
<script src="/docs/design/mockups/a/shared.js"></script>
<script src="/docs/design/mockups/a/parts-focus-dayclose.js"></script>
<script>
A.ready().then((doc) => {
  // The action: 이력서 갱신 (커리어), the first row of today's list. 12:41 left of 25:00 → 12 min 19 s run.
  const row = doc.view.today.rows.find((r) => r.text === '이력서 갱신');
  const area = A.areaIndex(doc, row.area);
  const left = 12 * 60 + 41, run = 25 * 60 - left;

  A.header('#header', { eyebrow: '', title: row.text, written: true });
  const h = document.querySelector('#header');
  h.firstElementChild.innerHTML = `<i class="a-dye" style="--d:var(--dye-${area + 1})"></i>${row.area} · 25분 집중`;
  h.insertAdjacentHTML('beforeend', `<div class="a-header-action" aria-label="접어 두기">${A.glyph('down')}</div>`);

  A.minutes('#minutes', { cell: 62, area, done: Math.floor(run / 60), frac: (run % 60) / 60 });

  const mm = Math.floor(left / 60), ss = String(left % 60).padStart(2, '0');
  document.querySelector('#clock').textContent = `${mm}:${ss}`;
  document.querySelector('#ends').innerHTML = `<small style="margin:0 4px 0 0">오후</small>2:35`; // invented clock time: started 2:10
  document.querySelector('#pause').innerHTML = `${A.glyph('pause', 20)}<span>멈추기</span>`;
});
</script>
</body>
</html>
