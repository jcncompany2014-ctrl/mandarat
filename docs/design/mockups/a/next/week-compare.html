<script>
A.ready().then((base) => {
  const mon = WK.scene(base, 'mon');
  const $ = (s) => document.querySelector(s);
  WK.home($('#home-now'), mon, { focus: 'pinned' });
  WK.today($('#today-now'), mon, { focus: 'pinned' });
  WK.home($('#home-next'), mon, { focus: 'group' });
