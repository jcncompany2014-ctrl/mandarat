<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="mock:size" content="674x548">
<title>시안 · 월 N회 습관 · 칸 편집의 지금과 바꾼 뒤 (not a screen)</title>
<link rel="stylesheet" href="/tools/design-mockups/kit.css">
<link rel="stylesheet" href="/docs/design/mockups/a/tokens.css">
<style>
  /* A contact sheet, not a screen. Phones at half size (195 × 422), so the captures of the app as
     it is today (390 × 844 px, month-before-*.png) sit pixel for pixel beside the mockup.
     Render this page after month-editor: it shows its PNG. */
  html, body { background: var(--tile); }
  .sheet { padding: 32px; }
  h2 { margin: 0 0 12px; font: 600 14px/18px var(--sans); color: var(--print-strong); }
  .phones { display: flex; gap: 12px; }
  .phone { width: 195px; }
  .phone img { display: block; width: 195px; height: 422px; border-radius: 14px; background: var(--paper); }
  .phone span { display: block; margin-top: 8px; font: 500 13px/18px var(--sans); color: var(--print); }
  .phone.is-after span { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<div class="sheet">
  <h2>칸 편집 · ‘월 2회 독서 모임’</h2>
  <div class="phones">
    <div class="phone"><img src="/docs/design/mockups/a/next/month-before-once.png" alt=""><span>지금 · 적으면 ‘한 번’으로 남음</span></div>
    <div class="phone"><img src="/docs/design/mockups/a/next/month-before-habit.png" alt=""><span>지금 · 습관은 주 단위뿐</span></div>
    <div class="phone is-after"><img src="/docs/design/mockups/a/next/month-editor.png" alt=""><span>바꾼 뒤 · 글을 보고 월 2회</span></div>
  </div>
</div>
</body>
</html>
