<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="mock:size" content="390x844">
<title>A · 실천 시트 · 주 3회 운동</title>
<link rel="stylesheet" href="/tools/design-mockups/kit.css">
<link rel="stylesheet" href="/tools/design-mockups/fonts.css">
<link rel="stylesheet" href="/docs/design/mockups/a/tokens.css">
<link rel="stylesheet" href="/docs/design/mockups/a/parts-sheets.css">
<style>
  /* 실천 시트: what you do with one cell. Opened from the sheet (tap a cell); the 9×9 stays behind,
     dimmed, with the tapped cell framed in ink. Order (HL-16): the words, today's check, this week,
     the cell's own completion, then two doors, then the memo. Every check sits in the leading
     24pt column; nothing on the right but chevrons. */
  .chart-wrap { display: flex; justify-content: center; margin-top: 18px; }
  .s-title { margin-top: 6px; }
  .s-title + .t-meta { display: block; }
  .s-week-say { display: flex; align-items: baseline; gap: 8px; height: 30px; margin-bottom: 6px; }
  .s-week-say .t-figure { font-size: 22px; line-height: 30px; }
  .s-week-say .t-figure small { font-size: 13px; }
</style>
</head>
<body>
<div class="a-page">
  <div id="header"></div>
  <div class="chart-wrap"><div id="chart"></div></div>
  <div id="bar"></div>

  <div class="a-scrim s-scrim"></div>
  <div class="a-sheet s-sheet" id="sheet"></div>
</div>
<script src="/docs/design/mockups/a/shared.js"></script>
<script src="/docs/design/mockups/a/parts-sheets.js"></script>
<script>
A.ready().then((doc) => {
  const AREA = 0, INDEX = 0; // 건강 · 주 3회 운동
  const act = doc.areas[AREA].actions[INDEX];

  // behind: the 만다라트 tab, the tapped cell framed in ink
  A.header('#header', { eyebrow: '핵심 목표', title: doc.coreGoal, written: true, action: 'share' });
  A.chart('#chart', doc, { level: 'L2', cell: 41, focus: [0, 0] });
  A.tabBar('#bar', { active: 'chart' });

  // this week (doc.view.today: "이번 주 0/3회", week "·· T ····"): Mon and Tue can still be ticked
  // after the fact, today is open, the days to come are printed faint.
  const days = doc.view.week.days.map(([d, , t]) => ({ d, today: t === 'today', s: t === 'today' || d === '월' || d === '화' ? 'open' : 'later' }));
  const left = days.length - days.findIndex((x) => x.today);

  document.querySelector('#sheet').innerHTML = `
    ${S.head(doc, AREA, INDEX)}

    <div class="t-title is-written s-title">${act.text}</div>
    <span class="t-meta">습관 · 주 ${act.perWeek}회 · 오늘 할 일에 저절로 담겨요</span>

    <div class="a-list" style="margin-top:18px">
      ${A.row(doc, { text: '오늘 했어요' })}
    </div>

    <section class="s-group">
      <div class="a-section"><span class="t-label">이번 주</span><span class="t-label">10월 12일 – 18일</span></div>
      <div class="s-week-say"><span class="t-figure">0/${act.perWeek}<small>회</small></span><span class="t-meta">남은 날 ${left}일</span></div>
      ${S.days(days)}
    </section>

    <div class="a-list" style="margin-top:24px">
      ${A.row(doc, { text: '이 칸 달성하기', meta: '몸에 뱄다면 눌러 주세요' })}
      ${S.linkRow({ icon: 'focus', title: '25분 집중하기' })}
      ${S.linkRow({ icon: 'edit', title: '칸 편집하기' })}
    </div>

    <section class="s-group">
      <div class="a-section"><span class="t-label">메모</span></div>
      ${S.memo(3, '어떻게 했는지 한 줄 남겨 두세요')}
    </section>`;
});
</script>
</body>
</html>
