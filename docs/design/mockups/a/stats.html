<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="mock:size" content="390x844">
<title>A · 통계</title>
<link rel="stylesheet" href="/tools/design-mockups/kit.css">
<link rel="stylesheet" href="/tools/design-mockups/fonts.css">
<link rel="stylesheet" href="/docs/design/mockups/a/tokens.css">
<style>
  /* 통계 in the clean style: the same hero as Home (fields on the gutter, the sheet in miniature on
     the right), then one time scope at a time (HL-07). In 이번 주: one sentence that reads the week,
     the week as seven bars (Home's week strip, larger, each bar stacked in the washes of the areas it
     was for: CD-13), and the three kinds as aligned lines; a kind with no data is one line (FI-16).
     Space groups; no rules except the faint hairline between the kinds. */

  .hero { display: flex; gap: 24px; margin-top: 18px; }
  .hero-fields { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 2px 0; }
  .hero-field { display: flex; flex-direction: column; gap: 2px; }

  /* scope line: the same drawing as the filter line on 오늘 (ink words, the chosen one Bold, 1pt ink underline) */
  .scopes { display: flex; gap: 24px; height: 44px; align-items: center; margin-top: 18px; }
  .scope { position: relative; display: inline-flex; align-items: center; height: 44px; font: 500 15px/18px var(--sans); color: var(--ink); }
  .scope.is-on { font-weight: 700; }
  .scope.is-on::after { content: ''; position: absolute; left: 0; right: 0; bottom: 9px; height: 1px; background: var(--ink); }
  .scopes .range { margin-left: auto; }

  .reading { margin-top: 10px; }
  .reading .t-prompt { text-wrap: balance; }
  .reading .t-meta { margin-top: 2px; }

  /* the week: Home's strip (count on top, bar, weekday under, a later day as a dot), drawn larger and
     with each bar stacked from the washes of the areas it was for, largest area at the base.
     KIT REQUEST: A.weekStrip(target, week, { stack: [[area, …], …], bar: 28, plot: 84 }). */
  .wk { margin-top: 14px; }
  .wk .a-week-plot { height: 84px; }
  .wk-stack { display: flex; flex-direction: column-reverse; gap: 3px; }
  .wk-seg { display: block; width: 28px; height: 18px; border-radius: 6px; }
  .wk .a-week-day.is-today .a-week-n { color: var(--ink); }
  .wk-key { display: flex; gap: 16px; margin-top: 14px; }
  .wk-key span { display: inline-flex; align-items: center; }
  .wk-key b { font-weight: 600; color: var(--ink); margin-left: 4px; }

  /* the kinds: aligned columns, a faint hairline between lines, none above or below */
  .kinds { margin-top: 22px; }
  .kind { position: relative; display: flex; align-items: center; height: 44px; }
  .kind + .kind::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: var(--hair); background: var(--print-rule); }
  .kind-name { width: 76px; font: 600 15px/18px var(--sans); color: var(--ink); }
  .kind .t-meta { flex: 1; font-size: 13px; }
  .kind-fig { font: 700 16px/20px var(--sans); color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .kind-fig small { font: 500 12px/18px var(--sans); color: var(--ink-2); margin-left: 1px; }
  .kind .a-link { height: 44px; }
</style>
</head>
<body>
<div class="a-page">
  <div id="header"></div>
  <div class="a-body">
    <section class="hero">
      <div class="hero-fields">
        <div class="hero-field">
          <div class="t-label">연속</div>
          <div class="t-figure is-field" id="fig-streak"></div>
          <div class="t-meta" id="streak-note"></div>
        </div>
        <div class="hero-field">
          <div class="t-label">달성</div>
          <div class="t-figure is-field" id="fig-cells"></div>
          <div class="t-meta" id="month-note"></div>
        </div>
      </div>
      <div id="chart"></div>
    </section>

    <nav class="scopes">
      <span class="scope is-on">이번 주</span><span class="scope">10주</span><span class="scope">올해</span>
      <span class="t-label range" id="range"></span>
    </nav>

    <section class="reading">
      <div class="t-prompt" id="headline"></div>
      <div class="t-meta" id="delta"></div>
    </section>

    <section class="wk">
      <div id="wk"></div>
      <div class="wk-key t-meta" id="key"></div>
    </section>

    <section class="kinds" id="kinds"></section>
  </div>
  <div id="bar"></div>
</div>
<script src="/docs/design/mockups/a/shared.js"></script>
<script>
A.ready().then((doc) => {
  const v = doc.view, s = v.stats, d = v.date;
  A.header('#header', { eyebrow: `${d.year} · ${d.week} · D-${d.left.replace(/\D/g, '')}`, title: '통계' });

  // hero: the sheet in miniature, the same size and drawing as on Home
  A.chart('#chart', doc, { level: 'L1', cell: 20 });
  // the streak: the figure and a kind sentence (no flame, no warning, no tally)
  document.querySelector('#fig-streak').innerHTML = `${parseInt(s.streak, 10)}<small>일</small>`;
  document.querySelector('#streak-note').textContent = s.streakNote;
  document.querySelector('#fig-cells').innerHTML = `${v.progress.done}/${v.progress.of}<small>칸</small>`;
  document.querySelector('#month-note').textContent = s.best.split(' · ')[1].replace(' 달성', '');

  document.querySelector('#range').textContent = '10월 12일 – 18일';
  document.querySelector('#headline').textContent = A.keep(s.headline);
  document.querySelector('#delta').textContent = `모두 ${v.week.total} · ${s.delta}`;

  // ── the week ────────────────────────────────────────────────────────────────
  // Who did what on which day, from the record's week strings (v.today.rows[].week, v.week.days):
  //   월 3 = 하루 물 2L, 1만보 걷기 (건강) + 명상 10분 (마음챙김)
  //   화 3 = 하루 물 2L, 1만보 걷기 (건강) + 아침 글쓰기 (자기계발)
  //   수 1 = 하루 물 2L (건강, done today)          → 건강 5, as the headline says; total 7.
  const H = A.areaIndex(doc, '건강'), SELF = A.areaIndex(doc, '자기계발'), MIND = A.areaIndex(doc, '마음챙김'), C = A.areaIndex(doc, '커리어');
  const byDay = [[H, H, MIND], [H, H, SELF], [H], null, null, null, null];
  const host = document.querySelector('#wk');
  host.classList.add('a-week');
  host.innerHTML = v.week.days.map((day, i) => {
    const list = byDay[i];
    const cls = (day[2] === 'today' ? ' is-today' : '') + (day[0] === '일' ? ' is-sunday' : '');
    const plot = list == null
      ? '<i class="a-week-bar is-later"></i>'
      : `<b class="a-week-n">${list.length}</b><span class="wk-stack">${list.map((a) => `<i class="wk-seg" style="background:var(--wash-l1-${a + 1})"></i>`).join('')}</span>`;
    return `<div class="a-week-day${cls}"><div class="a-week-plot">${plot}</div><span class="t-label">${day[0]}</span></div>`;
  }).join('');

  // what the colours are: the areas with their counts (커리어, which the sentence names, at 0)
  const count = (a) => byDay.flat().filter((x) => x === a).length;
  document.querySelector('#key').innerHTML = [H, SELF, MIND, C].map((a) => `<span><i class="a-dye" style="--d:var(--dye-${a + 1})"></i>${doc.areas[a].title}<b>${count(a)}</b></span>`).join('');

  // the kinds: 습관 · 마음가짐 · 집중
  const [habit, mind, focus] = s.rows;
  const fig = (t) => t.replace(/(\d+)([^\d/\s]+)/g, '$1<small>$2</small>');
  document.querySelector('#kinds').innerHTML =
    `<div class="kind"><span class="kind-name">${habit[0]}</span><span class="t-meta">${habit[1]}</span><span class="kind-fig">${fig(habit[2])}</span></div>` +
    `<div class="kind"><span class="kind-name">${mind[0]}</span><span class="t-meta">아직 매기지 않았어요</span><span class="a-link">매기기${A.icon('chevron', { size: 16 })}</span></div>` +
    `<div class="kind"><span class="kind-name">${focus[0]}</span><span class="t-meta">${focus[1]}</span><span class="kind-fig">${fig(focus[2])}</span></div>`;

  A.tabBar('#bar', { active: 'stats' });
});
</script>
</body>
</html>
